name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --requirement requirements-dev.txt
      - name: Lint
        run: python -m ruff check samsarix_discord_bot tests
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest
      - name: Static security scan
        run: python -m bandit -q -r samsarix_discord_bot
      - name: Dependency audit
        run: python -m pip_audit --strict --requirement requirements.txt
      - name: Compile legacy snapshot
        run: python -m compileall -q discord_bot_src
      - name: Build distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify wheel contents
        shell: python
        run: |
          import pathlib, tarfile, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert any(name.startswith("samsarix_discord_bot/") for name in names)
          assert "samsarix_discord_bot/py.typed" in names
          assert not any(name.startswith("discord_bot_src/") for name in names)
          assert any(name.endswith("/LICENSE") for name in names)
          assert any(name.endswith("/NOTICE") for name in names)
          assert any(name.endswith("/TRADEMARKS.md") for name in names)
          sdist = next(pathlib.Path("dist").glob("*.tar.gz"))
          with tarfile.open(sdist) as archive:
              source_names = archive.getnames()
          assert any(name.endswith("/docs/RELEASING.md") for name in source_names)
          assert any(name.endswith("/SECURITY.md") for name in source_names)
          assert not any("/discord_bot_src/" in name for name in source_names)
